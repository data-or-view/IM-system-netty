# =============================================
# IM System 配置
# =============================================
# 配置优先级: -D 参数 > 环境变量 > 此文件 > 代码默认值
# 所有配置键使用 im. 前缀命名空间
# =============================================

im:
  # ── 服务器 ──
  server:
    boss-threads: 1              # Boss 线程数
    worker-threads: 0            # Worker 线程数 (0=Netty 自动选择)
    business-threads: 8          # 业务线程数
    use-epoll: true              # 是否优先使用 epoll
    idle-timeout: 180            # 空闲超时秒数
    heartbeat-timeout: 120       # 心跳超时秒数
    max-frame-length: 4194304    # 最大帧长度 (4MB)
    socket-rcv-buf: 65535        # Socket 接收缓冲区
    socket-snd-buf: 65535        # Socket 发送缓冲区

  # ── WebSocket ──
  ws:
    enabled: true                # 启用 WebSocket
    port: 8081                   # WebSocket 端口

  # ── HTTP REST ──
  http:
    enabled: true                # 启用 HTTP REST API
    port: 8082                   # HTTP REST 端口

  # ── 节点 ──
  node:
    id: "node-1"                 # 本节点 ID

  # ── Token ──
  token:
    secret: "im-system-dev-secret-change-in-production"

  # ── 数据库（开启需要 Docker MySQL, 见 application-macbook-dev.yml） ──
  db:
    enabled: false               # 启用数据库持久化（设为 true 需要 MySQL 容器）
    schema: auto                 # 自动建表: none(跳过) / auto(不存在时创建) / rebuild(先删后建)
    jdbc-url: "jdbc:mysql://127.0.0.1:3306/im_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    username: "root"
    password: "password"

  # ── Redis ──
  redis:
    host: ""                     # Redis 主机 (为空时使用本地模式)
    port: 6379                   # Redis 端口
    username: ""                 # Redis ACL 用户名（空表示默认用户）
    password: ""                 # Redis 密码
    database: 0                  # Redis 数据库号
    cluster:
      nodes: ""                  # 集群节点 (逗号分隔, 如 "127.0.0.1:6379,127.0.0.1:6380")

  # ── 业务消息队列 ──
  mq:
    type: rocketmq             # redis / rocketmq
    failure-compensation:
      batch-size: 100            # 每轮最多重放失败表记录数
      max-attempts: 10           # 单条失败记录最大补偿次数
      idle-interval-ms: 2000     # 没有到期记录时的扫描间隔
      base-delay-ms: 1000        # 失败后指数退避基础延迟
      claim-lease-ms: 30000      # RETRYING 抢占租约；节点宕机后到期可被其他节点重新 claim

  # ── RocketMQ（im.mq.type=rocketmq 时使用） ──
  rocketmq:
    name-server: "127.0.0.1:9876"
    producer:
      group: "im-producer"
    consumer:
      group-prefix: "im-consumer"
      # 首次部署可用 LAST；恢复、迁移或重建 consumer group 前需按运维策略改为 FIRST/TIMESTAMP，避免跳过历史积压。
      consume-from-where: "CONSUME_FROM_LAST_OFFSET"
      consume-timestamp: ""      # consume-from-where=CONSUME_FROM_TIMESTAMP 时使用 yyyyMMddHHmmss
    topic-prefix: ""             # 可设为 "im-prod-"，则 persist -> im-prod-persist；RocketMQ topic 不允许点号
    send:
      timeout-ms: 3000
    retry-times: 2

  # ── 幂等性 ──
  idempotency:
    send-expire-seconds: 86400   # 发送消息 clientMsgId 幂等记录保留 24 小时

  # ── Webhook ──
  webhook:
    url: ""                      # Webhook 回调 URL

  # ── RTC 通话 ──
  call:
    enabled: true
    provider: livekit
    api-key: "devkey"
    api-secret: "im-system-livekit-secret-2024"
    sfu-endpoint: "ws://localhost:7880"
    timeout-seconds: 30          # 通话超时秒数（超时未接听自动 TIMEOUT）

  # ── MinIO 文件存储 ──
  minio:
    endpoint: "http://127.0.0.1:9000"
    access-key: "minioadmin"
    secret-key: "minioadmin"
    bucket: "im-system"
    presign-expire-seconds: 900
