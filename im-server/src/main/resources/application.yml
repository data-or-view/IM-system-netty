# =============================================
# IM System 配置
# =============================================
# 配置优先级: -D 参数 > 环境变量 > 此文件 > 代码默认值
# 所有配置键使用 im. 前缀命名空间
# =============================================

im:
  # file:
  #   max-upload-bytes: 104857600 # Primary upload limit; im.minio.max-file-size is a deprecated fallback.

  security:
    allow-development-defaults: false # Set true only for explicitly authorized local development.

  # ── 服务器 ──
  server:
    boss-threads: 1              # Boss 线程数
    worker-threads: 0            # Worker 线程数 (0=Netty 自动选择)
    business-threads: 8          # 业务线程数
    use-epoll: true              # 是否优先使用 epoll
    idle-timeout: 180            # 空闲超时秒数
    heartbeat-timeout: 120       # 心跳超时秒数
    max-frame-length: 4194304    # 最大帧长度 (4MB)
    socket-rcv-buf: 65535        # Socket 接收缓冲区
    socket-snd-buf: 65535        # Socket 发送缓冲区

  # ── WebSocket ──
  ws:
    enabled: true                # 启用 WebSocket
    port: 8081                   # WebSocket 端口

  # ── HTTP REST ──
  http:
    enabled: true                # 启用 HTTP REST API
    port: 8082                   # HTTP REST 端口
    trusted-proxy-enabled: false # 只有服务部署在可信反向代理/LB 后面时才设为 true；否则客户端可伪造 X-Forwarded-For 绕过 IP 限流。
    client-ip-header: "X-Forwarded-For" # trusted-proxy-enabled=true 时读取的真实客户端 IP Header，取逗号分隔的第一个地址。

  # ── 节点 ──
  node:
    id: "node-1"                 # 本节点 ID

  # ── Token ──
  token:
    secret: "im-system-dev-secret-change-in-production"

  # ── 数据库（开启需要 Docker MySQL, 见 application-macbook-dev.yml） ──
  db:
    enabled: false               # 启用数据库持久化（设为 true 需要 MySQL 容器）
    schema: auto                 # none / auto(仅空库建V2) / migrate(显式升级v1.1) / rebuild(仅本地重建)
    jdbc-url: "jdbc:mysql://127.0.0.1:3306/im_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    username: "root"
    password: "password"

  # ── Redis ──
  redis:
    host: ""                     # Redis 主机 (为空时使用本地模式)
    port: 6379                   # Redis 端口
    username: ""                 # Redis ACL 用户名（空表示默认用户）
    password: ""                 # Redis 密码
    database: 0                  # Redis 数据库号
    cluster:
      nodes: ""                  # 集群节点 (逗号分隔, 如 "127.0.0.1:6379,127.0.0.1:6380")

  # ── 业务消息队列 ──
  mq:
    type: rocketmq             # redis / rocketmq
    failure-compensation:
      batch-size: 100            # 每轮最多重放失败表记录数
      max-attempts: 10           # 单条失败记录最大补偿次数
      idle-interval-ms: 2000     # 没有到期记录时的扫描间隔
      base-delay-ms: 1000        # 失败后指数退避基础延迟
      claim-lease-ms: 30000      # RETRYING 抢占租约；节点宕机后到期可被其他节点重新 claim

  # ── RocketMQ（im.mq.type=rocketmq 时使用） ──
  rocketmq:
    name-server: "127.0.0.1:9876"
    producer:
      group: "im-producer"
    consumer:
      group-prefix: "im-consumer"
      # 首次部署可用 LAST；恢复、迁移或重建 consumer group 前需按运维策略改为 FIRST/TIMESTAMP，避免跳过历史积压。
      consume-from-where: "CONSUME_FROM_LAST_OFFSET"
      consume-timestamp: ""      # consume-from-where=CONSUME_FROM_TIMESTAMP 时使用 yyyyMMddHHmmss
    topic-prefix: ""             # 可设为 "im-prod-"，则 persist -> im-prod-persist；RocketMQ topic 不允许点号
    send:
      timeout-ms: 3000
    retry-times: 2

  # ── 幂等性 ──
  idempotency:
    send-expire-seconds: 86400   # 发送消息 clientMsgId 幂等记录保留 24 小时

  # ── 消息查询边界 ──
  # 客户端驱动的拉取和增量同步必须在 handler 和 SQL 查询两层保持有界。
  message:
    pull:
      max-limit: 100
    sync:
      max-conversations: 20

  # ── Redis 集群限流 ──
  # 所有限流 key 都写 Redis，集群多节点共享；不要在生产路径改成本地内存限流。
  # fail-open=false 表示 Redis 限流不可用时拒绝高风险请求，企业默认优先保护系统。
  rate-limit:
    enabled: true
    fail-open: false
    key-prefix: "im:rl:"          # 建议按环境隔离，如 im:rl:prod: / im:rl:staging:

    # 登录：同时限制来源 IP 和提交的账号，避免单 IP 爆破与分布式撞库。
    login:
      ip:
        limit: 10
        window-seconds: 60
      user:
        limit: 5
        window-seconds: 60

    # 注册：按 IP 控制批量注册。
    register:
      ip:
        limit: 5
        window-seconds: 300

    # 单聊发送：限制单个用户总发送速率和对同一目标用户的发送速率。
    chat-send:
      user:
        limit: 120
        window-seconds: 60
      user-target:
        limit: 60
        window-seconds: 60

    # 群聊发送：限制单个用户总发送速率和同一用户在同一群的发送速率。
    chat-send-group:
      user:
        limit: 120
        window-seconds: 60
      user-group:
        limit: 60
        window-seconds: 60

    # 消息查询：按认证用户在 Redis 中跨节点计数。
    chat-pull:
      user:
        limit: 60
        window-seconds: 60
    chat-sync:
      user:
        limit: 20
        window-seconds: 60

    # 好友申请：限制单用户总申请量，也限制对同一目标用户反复申请。
    friend-apply:
      user:
        limit: 30
        window-seconds: 3600
      user-target:
        limit: 3
        window-seconds: 86400

    # 入群申请：限制单用户总申请量，也限制对同一群反复申请。
    group-join:
      user:
        limit: 30
        window-seconds: 3600
      user-group:
        limit: 3
        window-seconds: 86400

    # 文件上传：覆盖上传、上传签名、完成、分片初始化、分片签名、分片上传、分片完成和分片中止接口。
    file-upload:
      user:
        limit: 120
        window-seconds: 600

    # 管理员系统消息：同时限制单管理员和全局发布频率，避免误操作刷屏。
    admin-system-message:
      user:
        limit: 20
        window-seconds: 60
      global:
        limit: 60
        window-seconds: 60

  # ── Webhook ──
  webhook:
    url: ""                      # Webhook 回调 URL

  # ── RTC 通话 ──
  call:
    enabled: true
    provider: livekit
    api-key: "devkey"
    api-secret: "im-system-livekit-secret-2024"
    sfu-endpoint: "ws://localhost:7880"
    timeout-seconds: 30          # 通话超时秒数（超时未接听自动 TIMEOUT）
    group:
      max-participants: 16
      # 滚动升级先保持 legacy；旧节点下线且旧通话清空后，显式切换到 tagged-v3。
      # Redis Cluster 无法原子操作 legacy 跨槽键，因此在 legacy 模式下会拒绝启动群通话存储。
      redis-key-layout: "legacy"

  # ── MinIO 文件存储 ──
  minio:
    endpoint: "http://127.0.0.1:9000"
    access-key: "minioadmin"
    secret-key: "minioadmin"
    bucket: "im-system"
    presign-expire-seconds: 900
