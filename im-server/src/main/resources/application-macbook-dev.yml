# =============================================
# IM System — MacBook 本地开发配置
# =============================================
# 激活方式: -Dim.env=macbook-dev 或 IM_ENV=macbook-dev
# 此文件覆盖 application.yml 中的值（优先级 order=1 > 默认 order=2）
# =============================================

im:
  # ── 服务器 ──
  node:
    id: "macbook-dev"

  # ── WebSocket / HTTP (避免与 Docker 容器端口冲突) ──
  ws:
    port: 8083
  http:
    port: 8084
    trusted-proxy-enabled: false  # 本地直连开发不信任代理 Header；如本地经 Nginx/LB 转发再按实际链路开启。

  # ── Redis 集群限流 ──
  rate-limit:
    key-prefix: "im:rl:macbook-dev:" # 本地开发独立限流命名空间，避免与其他环境共用 Redis 时互相影响。
    # 本地场景测试会在短时间内批量创建/登录测试用户；生产环境不要照搬这组放宽值。
    login:
      ip:
        limit: 300
        window-seconds: 60
    register:
      ip:
        limit: 300
        window-seconds: 60

  # ── 数据库 (MySQL 容器 root/123456) ──
  db:
    enabled: true                # 启用数据库
    jdbc-url: "jdbc:mysql://127.0.0.1:3306/im_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    username: "root"
    password: "123456"

  # ── Redis (启用本地 Docker Redis) ──
  redis:
    host: "127.0.0.1"
    port: 6379
    username: ""
    password: "difyai123456"
    database: 0

  # ── MinIO ──
  minio:
    endpoint: "http://127.0.0.1:9000"
    access-key: "myuser"
    secret-key: "mysecret123"
    bucket: "im-system"
    presign-expire-seconds: 900
